version: "3.8"

services:
  documentserver:
    container_name: documentserver
    image: onlyoffice/documentserver:9.3
    expose:
      - "80"
    environment:
      - JWT_SECRET=developer-only-not-a-real-secret

  example:
    container_name: example
    build:
      context: .
      target: example
    expose:
      - "80"
    volumes:
      - "example:/srv"
    environment:
      - ADDRESS=0.0.0.0
      - DOCUMENT_SERVER_PRIVATE_URL=http://proxy:8080
      - DOCUMENT_SERVER_PUBLIC_URL=http://localhost:8080
      - EXAMPLE_URL=http://proxy
      - JWT_SECRET=developer-only-not-a-real-secret
      - PORT=80

  proxy:
    container_name: proxy
    build:
      context: .
      target: proxy
    depends_on:
      - documentserver
      - example
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "example:/srv"

volumes:
  example:
